name: Java and Container CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

# Cancela a execução anterior da mesma branch quando um novo commit é enviado.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"

  # Nome da imagem criada apenas dentro do runner.
  LOCAL_IMAGE: aba02-ci:${{ github.sha }}

  # Nome e caminho do JAR produzido pelo Maven.
  JAR_FILE: target/aba02-0.0.1-SNAPSHOT.jar

jobs:

  # ============================================================
  # 1. Compilação
  # 2. Testes unitários
  # 3. Testes de integração
  # 4. Cobertura de código
  # ============================================================
  java-validation:
    name: Java validation
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Display Java and Maven versions
        run: |
          java -version
          mvn -version

      # clean verify executa:
      #
      # - limpeza do projeto;
      # - compilação;
      # - testes unitários;
      # - testes de integração, caso o Failsafe esteja configurado;
      # - empacotamento do JAR;
      # - verificações configuradas no Maven.
      #
      # jacoco:report gera o relatório de cobertura.
      - name: Compile, test and package application
        run: |
          mvn \
            --batch-mode \
            --no-transfer-progress \
            clean verify jacoco:report

      - name: Publish unit test report
        if: always()
        uses: dorny/test-reporter@v2.2.0
        with:
          name: Unit test results
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true
          fail-on-empty: false

      - name: Publish integration test report
        if: always()
        uses: dorny/test-reporter@v2.2.0
        with:
          name: Integration test results
          path: target/failsafe-reports/*.xml
          reporter: java-junit
          fail-on-error: true
          fail-on-empty: false

      - name: Verify JaCoCo coverage report
        run: |
          if [ ! -f target/site/jacoco/jacoco.xml ]; then
            echo "JaCoCo XML report was not generated."
            exit 1
          fi

          echo "JaCoCo report generated successfully:"
          ls -lh target/site/jacoco/jacoco.xml

      - name: Verify application JAR
        run: |
          if [ ! -f "${JAR_FILE}" ]; then
            echo "Application JAR was not generated: ${JAR_FILE}"
            exit 1
          fi

          echo "Application JAR generated successfully:"
          ls -lh "${JAR_FILE}"

      # O próximo job será executado em outro runner.
      # Por isso, o JAR precisa ser enviado como artifact.
      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: ${{ env.JAR_FILE }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload Java reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7

  # ============================================================
  # 5. Análise das dependências modificadas pela Pull Request
  #
  # Essa análise compara as dependências anteriores com as novas.
  # Portanto, ela executa somente em Pull Requests.
  # ============================================================
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ============================================================
  # 6. Análise estática e segurança do código Java
  # ============================================================
  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin

  # ============================================================
  # 7. Validação do Dockerfile
  # 8. Build da imagem
  # 9. Scan de vulnerabilidades da imagem
  # 10. Inicialização do container
  # 11. Smoke test da aplicação
  #
  # Depois de um push na main, normalmente causado por um merge,
  # a mesma imagem validada será publicada no GHCR.
  # ============================================================
  container-validation:
    name: Container validation
    runs-on: ubuntu-latest

    needs:
      - java-validation
      - dependency-review
      - codeql

    # No evento push, dependency-review será skipped.
    # Isso não deve impedir o restante do pipeline.
    if: |
      always() &&
      needs.java-validation.result == 'success' &&
      needs.codeql.result == 'success' &&
      (
        needs.dependency-review.result == 'success' ||
        needs.dependency-review.result == 'skipped'
      )

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Recupera o JAR criado no job java-validation.
      - name: Download application JAR
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target

      - name: Verify downloaded JAR
        run: |
          if [ ! -f "${JAR_FILE}" ]; then
            echo "Downloaded JAR was not found: ${JAR_FILE}"
            exit 1
          fi

          echo "Downloaded JAR:"
          ls -lh "${JAR_FILE}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Analisa o Dockerfile e a configuração do build sem publicar imagem.
      - name: Validate Dockerfile and build configuration
        uses: docker/build-push-action@v6
        with:
          context: .
          call: check

      # A imagem é carregada no Docker local do runner.
      # Dessa forma, poderá ser analisada pelo Trivy e iniciada pelo docker run.
      - name: Build local container image
        run: |
          docker buildx build \
            --load \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${LOCAL_IMAGE}" \
            .

          echo "Container image created successfully:"
          docker image inspect "${LOCAL_IMAGE}"

      # Bloqueia o pipeline quando encontrar vulnerabilidades corrigíveis
      # com severidade HIGH ou CRITICAL.
      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      # Inicia apenas o container da aplicação.
      # Não há PostgreSQL, Redis ou qualquer outro serviço externo.
      - name: Start application container
        run: |
          docker run \
            --detach \
            --name aba02-ci-app \
            --publish 8080:8080 \
            "${LOCAL_IMAGE}"

          echo "Application container started:"
          docker ps --filter "name=aba02-ci-app"

      # Espera a aplicação iniciar e consulta o endpoint de saúde.
      - name: Smoke test application
        run: |
          for attempt in {1..30}; do
            echo "Smoke test attempt ${attempt}/30"

            if curl \
              --fail \
              --silent \
              --show-error \
              http://localhost:8080/actuator/health
            then
              echo
              echo "Application smoke test passed."
              exit 0
            fi

            # Verifica se o container encerrou durante a inicialização.
            if [ "$(docker inspect \
              --format='{{.State.Running}}' \
              aba02-ci-app)" != "true" ]
            then
              echo "Application container stopped unexpectedly."
              docker logs aba02-ci-app
              exit 1
            fi

            sleep 3
          done

          echo "Application did not become healthy within the timeout."
          docker logs aba02-ci-app
          exit 1

      # ========================================================
      # Publicação no GitHub Container Registry — GHCR
      #
      # Estas etapas não executam em Pull Requests.
      # Executam somente em push para a main.
      # ========================================================
      - name: Define GHCR image name
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publica exatamente a imagem que foi:
      #
      # - construída;
      # - analisada pelo Trivy;
      # - inicializada;
      # - aprovada pelo smoke test.
      - name: Publish validated image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SHA_IMAGE="${GHCR_IMAGE}:sha-${GITHUB_SHA}"
          LATEST_IMAGE="${GHCR_IMAGE}:latest"

          docker tag "${LOCAL_IMAGE}" "${SHA_IMAGE}"
          docker tag "${LOCAL_IMAGE}" "${LATEST_IMAGE}"

          docker push "${SHA_IMAGE}"
          docker push "${LATEST_IMAGE}"

          echo "Images published successfully:"
          echo "${SHA_IMAGE}"
          echo "${LATEST_IMAGE}"

      # Os logs são exibidos mesmo quando alguma etapa posterior falha.
      - name: Display application logs
        if: always()
        run: |
          echo "Application container logs:"
          docker logs aba02-ci-app || true

      # Remove o container de teste do runner.
      - name: Clean up application container
        if: always()
        run: |
          docker rm --force aba02-ci-app || true