name: Java and Container CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

# Cancela uma execução antiga da mesma branch quando um novo commit é enviado.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  LOCAL_IMAGE: aba02-ci:${{ github.sha }}

jobs:

  # ============================================================
  # 1. Compilação
  # 2. Testes unitários
  # 3. Testes de integração
  # 4. Cobertura
  # ============================================================
  java-validation:
    name: Java validation
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Display Java and Maven versions
        run: |
          java -version
          mvn -version

      # A fase verify executa:
      # compile -> unit tests -> integration tests -> package -> verify
      #
      # Os testes de integração precisam estar configurados com
      # Maven Failsafe no pom.xml.
      - name: Compile and run all tests
        run: |
          mvn \
            --batch-mode \
            --no-transfer-progress \
            clean verify

      - name: Publish unit test report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Unit test results
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true

      - name: Publish integration test report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Integration test results
          path: target/failsafe-reports/*.xml
          reporter: java-junit
          fail-on-error: true
          fail-on-empty: false

      - name: Verify JaCoCo report
        run: |
          test -f target/site/jacoco/jacoco.xml

          echo "JaCoCo XML report:"
          ls -lh target/site/jacoco/jacoco.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: target/site/jacoco/jacoco.xml
          flags: unit-and-integration-tests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      # O JAR será usado pelo job de container.
      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/aba02-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 1

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7

  # ============================================================
  # 5. Análise de dependências
  #
  # Esse job compara as dependências introduzidas pela PR.
  # Portanto, ele executa somente em pull_request.
  # ============================================================
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ============================================================
  # 6. Análise estática e segurança
  #
  # CodeQL procura padrões de vulnerabilidade no código Java.
  # build-mode none funciona para projeto somente Java.
  # ============================================================
  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin

  # ============================================================
  # 7. Validação do Dockerfile
  # 8. Build da imagem
  # 9. Scan de vulnerabilidades
  # 10. Inicialização do container
  # 11. Smoke test
  #
  # Em push para main, a imagem validada também é publicada
  # no GitHub Container Registry.
  # ============================================================
  container-validation:
    name: Container validation
    runs-on: ubuntu-latest

    needs:
      - java-validation
      - dependency-review
      - codeql

    # Na main, dependency-review será skipped porque só funciona em PR.
    # Isso não deve impedir o job de container.
    if: |
      always() &&
      needs.java-validation.result == 'success' &&
      needs.codeql.result == 'success' &&
      (
        needs.dependency-review.result == 'success' ||
        needs.dependency-review.result == 'skipped'
      )

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download application JAR
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target

      - name: Display downloaded JAR
        run: ls -lh target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Essa verificação analisa a configuração do build sem criar
      # efetivamente a imagem.
      - name: Validate Dockerfile and build configuration
        uses: docker/build-push-action@v7
        with:
          context: .
          call: check

      # --load disponibiliza a imagem no Docker local do runner.
      # Isso permite usar a mesma imagem no Trivy e no docker run.
      - name: Build container image
        run: |
          docker buildx build \
            --load \
            --tag "${LOCAL_IMAGE}" \
            .

          docker image inspect "${LOCAL_IMAGE}"

      - name: Scan image vulnerabilities with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Banco temporário usado somente durante o smoke test.
      - name: Create Docker test network
        run: docker network create aba02-ci-network

      - name: Start PostgreSQL test container
        run: |
          docker run --detach \
            --name aba02-ci-postgres \
            --network aba02-ci-network \
            --env POSTGRES_DB=aba02 \
            --env POSTGRES_USER=aba02 \
            --env POSTGRES_PASSWORD=aba02 \
            postgres:16-alpine

      - name: Wait for PostgreSQL
        run: |
          for attempt in {1..30}; do
            if docker exec aba02-ci-postgres \
              pg_isready --username=aba02 --dbname=aba02
            then
              echo "PostgreSQL is ready."
              exit 0
            fi

            echo "Waiting for PostgreSQL: attempt ${attempt}/30"
            sleep 2
          done

          echo "PostgreSQL did not become ready."
          docker logs aba02-ci-postgres
          exit 1

      - name: Start application container
        run: |
          docker run --detach \
            --name aba02-ci-app \
            --network aba02-ci-network \
            --publish 8080:8080 \
            --env SPRING_DATASOURCE_URL=jdbc:postgresql://aba02-ci-postgres:5432/aba02 \
            --env SPRING_DATASOURCE_USERNAME=aba02 \
            --env SPRING_DATASOURCE_PASSWORD=aba02 \
            "${LOCAL_IMAGE}"

      - name: Smoke test application
        run: |
          for attempt in {1..30}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              http://localhost:8080/actuator/health
            then
              echo
              echo "Application smoke test passed."
              exit 0
            fi

            echo "Waiting for application: attempt ${attempt}/30"
            sleep 3
          done

          echo "Application did not become healthy."
          docker logs aba02-ci-app
          exit 1

      - name: Display application logs
        if: always()
        run: docker logs aba02-ci-app || true

      # --------------------------------------------------------
      # Publicação no GHCR
      #
      # Não publica imagens de Pull Requests.
      # Publica somente após um push na main, normalmente causado
      # pelo merge de uma Pull Request.
      # --------------------------------------------------------
      - name: Define GHCR image name
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Faz push da mesma imagem que foi analisada, iniciada e testada.
      - name: Publish validated image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SHA_IMAGE="${GHCR_IMAGE}:sha-${GITHUB_SHA}"
          LATEST_IMAGE="${GHCR_IMAGE}:latest"

          docker tag "${LOCAL_IMAGE}" "${SHA_IMAGE}"
          docker tag "${LOCAL_IMAGE}" "${LATEST_IMAGE}"

          docker push "${SHA_IMAGE}"
          docker push "${LATEST_IMAGE}"

          echo "Published images:"
          echo "${SHA_IMAGE}"
          echo "${LATEST_IMAGE}"

      - name: Clean up containers
        if: always()
        run: |
          docker rm --force aba02-ci-app || true
          docker rm --force aba02-ci-postgres || true
          docker network rm aba02-ci-network || true
